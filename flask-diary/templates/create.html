{% extends "base.html" %}

{% block title %}Создание карточки{% endblock %}

{% block content %}

<div class="card-box">

    <h1>Создание карточки</h1>

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label for="title">Заголовок</label>

            <input
                type="text"
                id="title"
                name="title"
                required
            >
        </div>

        <div class="form-group">
            <label for="subtitle">Подзаголовок</label>

            <input
                type="text"
                id="subtitle"
                name="subtitle"
            >
        </div>

        <div class="form-group">
            <label for="text">Текст</label>

            <textarea
                id="text"
                name="text"
                required
            ></textarea>
        </div>

        <button class="btn" type="submit">
            Создать карточку
        </button>

    </form>

    <br>

    <a class="btn btn-secondary" href="{{ url_for('index') }}">
        Вернуться к карточкам
    </a>

</div>

{% endblock %}
