{% extends "base.html" %}

{% block title %}Регистрация{% endblock %}

{% block content %}

<div class="card-box">

    <h1>Регистрация</h1>

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label for="username">Имя пользователя</label>

            <input
                type="text"
                id="username"
                name="username"
                value="{{ username or '' }}"
                required
                minlength="3"
                maxlength="50"
                autocomplete="username"
                aria-describedby="username-hint"
            >
            <small id="username-hint">3–50 символов: буквы, цифры, точка, дефис, подчёркивание</small>
        </div>

        <div class="form-group">
            <label for="password">Пароль</label>

            <input
                type="password"
                id="password"
                name="password"
                required
                minlength="8"
                maxlength="128"
                autocomplete="new-password"
                aria-describedby="password-hint"
            >
            <small id="password-hint">От 8 до 128 символов</small>
        </div>

        <button class="btn" type="submit">
            Зарегистрироваться
        </button>

    </form>

    <br>

    <a class="btn btn-secondary" href="{{ url_for('auth.login') }}">
        Уже есть аккаунт
    </a>

</div>

{% endblock %}
