{% extends "base.html" %}

{% block title %}Создание карточки{% endblock %}

{% block content %}

<div class="card-box">

    <h1>Создание карточки</h1>

    {% set f = form or {} %}
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label for="title">Заголовок</label>

            <input
                type="text"
                id="title"
                name="title"
                value="{{ f.get('title', '') }}"
                required
                maxlength="100"
            >
        </div>

        <div class="form-group">
            <label for="subtitle">Подзаголовок</label>

            <input
                type="text"
                id="subtitle"
                name="subtitle"
                value="{{ f.get('subtitle', '') }}"
                maxlength="100"
            >
        </div>

        <div class="form-group">
            <label for="text">Текст</label>

            <textarea
                id="text"
                name="text"
                required
                maxlength="5000"
            >{{ f.get('text', '') }}</textarea>
        </div>

        <button class="btn" type="submit">
            Создать карточку
        </button>

    </form>

    <br>

    <a class="btn btn-secondary" href="{{ url_for('cards.index') }}">
        Вернуться к карточкам
    </a>

</div>

{% endblock %}
