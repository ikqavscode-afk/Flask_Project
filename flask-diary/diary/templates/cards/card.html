{% extends "base.html" %}

{% block title %}{{ card.title }}{% endblock %}

{% block content %}

<div class="card-full">

    <h1>{{ card.title }}</h1>

    {% if card.subtitle %}
        <div class="subtitle">
            {{ card.subtitle }}
        </div>
    {% endif %}

    <div class="text">
        {{ card.text }}
    </div>

    <br>

    <a class="btn btn-secondary" href="{{ url_for('cards.index') }}">
        Вернуться к карточкам
    </a>

    <a class="btn" href="{{ url_for('cards.edit', id=card.id) }}">
        Редактировать
    </a>

    <form
        method="POST"
        action="{{ url_for('cards.delete', id=card.id) }}"
        style="display:inline"
        onsubmit="return confirm('Удалить карточку?');"
    >
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="btn btn-secondary" type="submit">
            Удалить
        </button>
    </form>

</div>

{% endblock %}
