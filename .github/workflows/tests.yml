name: Tests

on:
  push:
    # Ветки проверяются через pull request, поэтому прямые отправки считаем только в main:
    # иначе каждый коммит в ветке с pull request запускал бы все задачи дважды.
    branches: [main]
  pull_request:
  schedule:
    # раз в неделю: новые уязвимости в зависимостях появляются и без изменений в коде
    - cron: "0 6 * * 1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.17.4
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install security tools
        run: pip install pip-audit==2.10.1 bandit==1.9.4
      - name: Static security analysis (medium and high severity)
        run: bandit -q -r flask-diary/diary flask-diary/main.py cli-shop/shop algorithms-dp/dp flask-notes-blog/app.py scripts -ll
      - name: Audit Flask Diary dependencies
        run: pip-audit -r flask-diary/requirements.txt --disable-pip --no-deps
      - name: Audit Notes Blog dependencies
        run: pip-audit -r flask-notes-blog/requirements.txt --disable-pip --no-deps

  flask-apps:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [flask-diary, flask-notes-blog]
        python: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    env:
      SECRET_KEY: ci-test-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r ../requirements-dev.txt
      - name: Run tests with coverage (diary)
        if: matrix.project == 'flask-diary'
        run: pytest -q --cov=diary --cov-fail-under=95
      - name: Run tests (blog)
        if: matrix.project == 'flask-notes-blog'
        run: pytest -q

  diary-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: diary
          POSTGRES_PASSWORD: diary
          POSTGRES_DB: diary_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diary -d diary_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: flask-diary
    env:
      TEST_DATABASE_URL: postgresql://diary:diary@localhost:5432/diary_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: flask-diary/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r ../requirements-dev.txt
      - name: Run tests on PostgreSQL
        run: pytest -q --cov=diary --cov-fail-under=95

  cli-shop:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: cli-shop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install pytest
        run: pip install -r ../requirements-dev.txt
      - name: Run tests with coverage
        run: pytest -q --cov=shop --cov-fail-under=90
      - name: Run app (exit from menu)
        run: printf '1\n0\n' | python main.py

  algorithms:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: algorithms-dp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install pytest
        run: pip install -r ../requirements-dev.txt
      - name: Run tests with coverage
        run: pytest -q --cov=dp --cov-fail-under=95
      - name: Run demo
        run: python demo.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t flask-diary flask-diary
      - name: Start container
        run: docker run -d --name diary -p 8000:8000 -e SECRET_KEY=ci-secret-key-for-smoke-test flask-diary
      - name: Check that the app responds
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "App is up"; exit 0
            fi
            sleep 1
          done
          docker logs diary
          exit 1
