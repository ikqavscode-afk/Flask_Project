name: Tests

on:
  push:
  pull_request:

jobs:
  flask-apps:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [flask-diary, flask-notes-blog]
        python: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    env:
      SECRET_KEY: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        run: pytest -q

  cli-shop:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: cli-shop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pytest
        run: pip install pytest
      - name: Run tests
        run: pytest -q
      - name: Run app (exit from menu)
        run: printf '1\n0\n' | python main.py

  algorithms:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: algorithms-dp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pytest
        run: pip install pytest
      - name: Run tests
        run: pytest -q
      - name: Run demo
        run: python demo.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t flask-diary flask-diary
      - name: Start container
        run: docker run -d --name diary -p 8000:8000 -e SECRET_KEY=ci-secret-key-for-smoke-test flask-diary
      - name: Check that the app responds
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8000/home > /dev/null; then
              echo "App is up"; exit 0
            fi
            sleep 1
          done
          docker logs diary
          exit 1
