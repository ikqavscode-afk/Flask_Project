name: Tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.17.4
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .

  flask-apps:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [flask-diary, flask-notes-blog]
        python: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    env:
      SECRET_KEY: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r ../requirements-dev.txt
      - name: Run tests with coverage (diary)
        if: matrix.project == 'flask-diary'
        run: pytest -q --cov=diary --cov-fail-under=95
      - name: Run tests (blog)
        if: matrix.project == 'flask-notes-blog'
        run: pytest -q

  diary-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: diary
          POSTGRES_PASSWORD: diary
          POSTGRES_DB: diary_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diary -d diary_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: flask-diary
    env:
      TEST_DATABASE_URL: postgresql://diary:diary@localhost:5432/diary_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: flask-diary/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r ../requirements-dev.txt
      - name: Run tests on PostgreSQL
        run: pytest -q --cov=diary --cov-fail-under=95

  cli-shop:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: cli-shop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pytest
        run: pip install -r ../requirements-dev.txt
      - name: Run tests with coverage
        run: pytest -q --cov=shop --cov-fail-under=90
      - name: Run app (exit from menu)
        run: printf '1\n0\n' | python main.py

  algorithms:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: algorithms-dp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pytest
        run: pip install -r ../requirements-dev.txt
      - name: Run tests with coverage
        run: pytest -q --cov=dp --cov-fail-under=95
      - name: Run demo
        run: python demo.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t flask-diary flask-diary
      - name: Start container
        run: docker run -d --name diary -p 8000:8000 -e SECRET_KEY=ci-secret-key-for-smoke-test flask-diary
      - name: Check that the app responds
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "App is up"; exit 0
            fi
            sleep 1
          done
          docker logs diary
          exit 1
