# Проверка доступности сайта. Если сайт не отвечает, запуск завершается ошибкой,
# и GitHub присылает уведомление (Settings → Notifications → Actions: «Send notifications for failed workflows only»).
#
# Побочный эффект: регулярные запросы не дают бесплатному сервису Render засыпать (меньше «холодных» стартов).
# Он расходует бесплатные часы (лимит 750 в месяц; один сервис, работающий круглосуточно, это около 744).
# Чтобы отключить, удалите блок schedule: проверку можно запускать вручную (workflow_dispatch).
name: Uptime

on:
  schedule:
    # Раз в 10 минут, но не в начале часа: по документации GitHub плановые запуски задерживаются
    # (а при нагрузке пропускаются) именно в начале каждого часа.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "Адрес для проверки (необязательно). Для проверки письма укажите несуществующий, например https://example.invalid"
        required: false
        type: string

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Check /health
        env:
          # Адрес можно сменить в Settings → Secrets and variables → Actions → Variables (APP_URL)
          APP_URL: ${{ inputs.url || vars.APP_URL || 'https://flask-diary-vwos.onrender.com' }}
        run: scripts/check_health.sh "$APP_URL" 3 20
