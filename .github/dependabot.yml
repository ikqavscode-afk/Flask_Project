# Автоматические предложения обновлений: зависимости, GitHub Actions и базовый образ Docker.
# Каждое предложение проходит те же проверки CI, что и обычный коммит.
version: 2
updates:
  - package-ecosystem: pip
    directory: /flask-diary
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /flask-notes-blog
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /flask-diary
    schedule:
      interval: weekly
    ignore:
      # Версия Python в образе должна совпадать с проверяемыми в CI (3.12 и 3.14):
      # переход на новую версию делаем сами, сначала добавив её в матрицу тестов.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
